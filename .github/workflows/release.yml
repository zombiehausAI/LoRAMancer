name: LoRAMancer Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Windows Workload
        shell: pwsh
        run: |
          dotnet workload install maui-windows

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build, Test & Package Release
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if (-not $appVersion) { $appVersion = "0.1.0" }
          Write-Host "Building LoRAMancer Release Version: $appVersion"
          .\Build-And-Package.ps1 -Version $appVersion -Configuration Release

      - name: Publish Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if (-not $appVersion) { $appVersion = "0.1.0" }
          $tag = "v$appVersion"
          $title = "LoRAMancer v$appVersion"
          $notes = "Official release v$appVersion of LoRAMancer.`n`n- **Commit**: $env:GITHUB_SHA"

          $files = @(Get-ChildItem -Path "artifacts" -File | Where-Object { $_.Extension -in '.exe', '.zip', '.sha256' } | Select-Object -ExpandProperty FullName)

          if ($files.Count -eq 0) {
              Write-Error "No packaged artifacts found in artifacts/ to upload."
              exit 1
          }

          Write-Host "Artifacts to upload:"
          $files | ForEach-Object { Write-Host " - $_" }

          $exists = $false
          try {
              gh release view $tag 2>$null
              if ($LASTEXITCODE -eq 0) { $exists = $true }
          } catch { }

          if ($exists) {
              Write-Host "Release $tag already exists, updating assets..."
              gh release upload $tag @files --clobber
          } else {
              Write-Host "Creating new official release $tag..."
              gh release create $tag @files --title "$title" --notes "$notes" --latest
          }

      - name: Automatically Increment Dev Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if (-not $appVersion) {
              Write-Warning "Could not read version from version.json. Skipping dev version increment."
              exit 0
          }

          if ($appVersion -match '^(\d+)\.(\d+)\.(\d+)') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3]
              $nextDevVersion = "$major.$minor.$($patch + 1)-dev.01"
          } else {
              Write-Warning "Version '$appVersion' does not match semver format X.Y.Z. Skipping dev version increment."
              exit 0
          }

          Write-Host "Released version: $appVersion"
          Write-Host "Next dev version: $nextDevVersion"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout -B dev origin/dev

          $versionContent = "{`n  `"version`": `"$nextDevVersion`"`n}"
          Set-Content -Path "version.json" -Value $versionContent

          git add version.json
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore: bump version to $nextDevVersion"
              git push origin dev
              Write-Host "Successfully bumped dev branch version to $nextDevVersion"
          } else {
              Write-Host "Dev branch is already set to $nextDevVersion or no changes detected."
          }
